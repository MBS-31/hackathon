; =============================================================================
; PHP-FPM Pool Configuration — CRM Backend
; =============================================================================

[www]
user  = www-data
group = www-data

listen = 127.0.0.1:9000

; ---- Process manager ----
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 500

; ---- Logging to Docker stdout/stderr ----
access.log           = /dev/null
slowlog              = /dev/stderr
request_slowlog_timeout = 10s

; ---- Error handling ----
php_admin_value[error_log]   = /dev/stderr
php_admin_flag[log_errors]   = on

; ---- Environment passthrough ----
clear_env = no
