; =============================================================================
; PHP Runtime Configuration — CRM Backend
; =============================================================================

; ---- Memory & Execution ----
memory_limit          = 256M
max_execution_time    = 60
max_input_time        = 60
post_max_size         = 20M
upload_max_filesize   = 20M
max_file_uploads      = 20

; ---- Error handling (Docker: log to stderr) ----
display_errors        = Off
display_startup_errors= Off
log_errors            = On
error_log             = /dev/stderr
error_reporting       = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ---- Date & timezone ----
date.timezone         = UTC

; ---- Session (API only — cookie-less) ----
session.use_cookies   = 0
session.use_only_cookies = 1
session.gc_maxlifetime = 1440

; ---- Security headers ----
expose_php = Off

; ---- Realpath cache ----
realpath_cache_size   = 4096K
realpath_cache_ttl    = 600
